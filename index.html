<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type Check</title>
<meta name="description" content="Pair two typefaces and proof them on real text. Editorial, mobile and specimen views, two pairs side by side, CSS out.">
<meta property="og:title" content="Type Check">
<meta property="og:description" content="Pair two typefaces and proof them on real text.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23cfcfca%22/%3E%3Ccircle cx=%2212%22 cy=%2216%22 r=%227%22 fill=%22%23c23a1c%22/%3E%3Ccircle cx=%2220%22 cy=%2216%22 r=%227%22 fill=%22%231d6f93%22 fill-opacity=%22.85%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Martian+Mono:wdth,wght@75..112.5,400..500&display=swap">
<style>
/* ── tokens: chrome (the light table) ───────────────────────── */
/* Neutral N8 grey so colour judgement stays honest; sheets are lit from above.
   Pair A = vermilion pencil, pair B = non-photo blue. */
:root{
  --bg:#cfcfca; --bg-sunk:#c6c6c1; --panel:#dcdcd7; --raised:#ebebe6;
  --fg:#161615; --fg-mid:#3d3d3a; --fg-dim:#555551;
  --line:#b6b6b0; --line-soft:#c8c8c3;
  --a:#c23a1c; --a-soft:rgba(194,58,28,.10); --a-line:rgba(194,58,28,.45);
  --b:#1d6f93; --b-soft:rgba(29,111,147,.12); --b-line:rgba(29,111,147,.45);
  --a-ink:#ef7a5d; --b-ink:#6cc0e5;   /* pencils on the Ink sheet */
  --solid-hover:#000;
  --focus:#161615;
  --shadow:0 1px 2px rgba(0,0,0,.08), 0 20px 44px -18px rgba(0,0,0,.42);
  --ui:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--ui); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}

/* ── shell ──────────────────────────────────────────────────── */
.app{display:flex; flex-direction:column; height:100dvh}

.topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:16px;
  padding:0 18px; height:56px; background:var(--bg); position:relative; z-index:30;
}
.brand{display:flex; align-items:baseline; gap:10px; padding-inline-end:4px; white-space:nowrap}
.brand b{font-weight:600; font-size:15px; letter-spacing:-.01em}
.brand a{font-size:12px; color:var(--fg-dim); text-decoration:none; padding-block:4px}
.brand a:hover{color:var(--fg); text-decoration:underline; text-underline-offset:3px}
.spacer{flex:1 1 auto}

/* segmented control */
.seg{display:flex; background:transparent; border:1px solid var(--line); border-radius:999px; padding:2px; gap:2px}
.seg button{
  border:0; background:transparent; color:var(--fg-mid);
  padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:450;
  transition:background .13s, color .13s;
}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raised); color:var(--fg); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.12)}

.btn{
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line); background:transparent; color:var(--fg);
  border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:450;
  transition:border-color .13s, color .13s, background .13s;
}
.btn:hover{border-color:var(--fg-mid)}
.btn[aria-pressed="true"]{background:var(--raised); border-color:var(--fg-mid); color:var(--fg); font-weight:600}
.btn.icon{padding:6px; width:32px; justify-content:center}
.btn.primary{background:var(--fg); border-color:var(--fg); color:var(--raised)}
.btn.primary:hover{background:var(--solid-hover)}
.btn svg{width:14px; height:14px; display:block}

.main{flex:1 1 auto; display:flex; min-height:0}

.field{display:flex; flex-direction:column; gap:5px}
.field > label,.rowlab{
  font-family:var(--mono); font-stretch:85%; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-mid);
}
.rowhead{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.val{font-family:var(--mono); font-size:10.5px; color:var(--fg-mid); font-variant-numeric:tabular-nums}
.val.auto{color:var(--fg-dim); font-style:italic}

input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:24px; background:transparent; margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:3px; background:var(--line); border-radius:2px}
input[type=range]::-moz-range-track{height:3px; background:var(--line); border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--raised); border:1.5px solid var(--accent-cur,var(--fg-mid)); margin-top:-5px;
  box-shadow:0 1px 2px rgba(0,0,0,.18);
}
input[type=range]::-moz-range-thumb{
  width:13px; height:13px; border-radius:50%; border:1.5px solid var(--accent-cur,var(--fg-mid));
  background:var(--raised); box-shadow:0 1px 2px rgba(0,0,0,.18);
}
input[type=range]:hover::-webkit-slider-thumb{border-color:var(--accent-cur,var(--fg))}

select,input[type=text]{
  width:100%; background:var(--raised); border:1px solid var(--line);
  border-radius:6px; padding:6px 8px; font-size:12.5px;
}
select{cursor:pointer; appearance:none; padding-right:24px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;
  background-size:4px 4px,4px 4px; background-repeat:no-repeat;
}
input[type=text]::placeholder{color:var(--fg-dim)}

.pill{
  border:1px solid var(--line); background:var(--raised); color:var(--fg-mid);
  border-radius:5px; padding:3px 9px; font-size:11.5px; line-height:1.3; min-height:28px;
}
.pill[aria-pressed="true"]{background:var(--accent-soft-cur,var(--a-soft)); border-color:var(--accent-cur,var(--a)); color:var(--accent-cur,var(--a)); font-weight:500}
.inline{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.reset{
  border:0; background:transparent; color:var(--fg-dim); font-family:var(--mono);
  font-size:10.5px; letter-spacing:.06em; padding:0 2px; text-decoration:underline; text-underline-offset:2px;
}
.reset:hover{color:var(--fg-mid)}
.hint{font-size:12px; color:var(--fg-dim); line-height:1.45}

</style>

<style>
/* ── font combobox ──────────────────────────────────────────── */
.combo{position:relative}
.combo .field-in{
  display:flex; align-items:center; gap:7px; width:100%;
  background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:6px 8px;
  text-align:left; transition:border-color .13s;
}
.combo .field-in:hover{border-color:var(--fg-dim)}
.combo .field-in .nm{
  flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:13px; color:var(--fg);
}
.combo .field-in .cat{
  font-family:var(--mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--fg-dim); flex:0 0 auto;
}
.pop{
  position:absolute; z-index:60; top:calc(100% + 5px); left:0; right:0;
  background:var(--raised); border:1px solid var(--line); border-radius:9px;
  box-shadow:var(--shadow); overflow:hidden; display:none;
}
.combo.open .pop{display:block}
.pop .search{padding:8px; border-bottom:1px solid var(--line-soft)}
.pop .filters{display:flex; gap:4px; padding:7px 8px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.pop .filters .pill{font-size:10px; padding:2px 7px}
.pop ul{list-style:none; margin:0; padding:4px; max-height:288px; overflow-y:auto; overscroll-behavior:contain}
.pop li{
  padding:6px 9px; border-radius:5px; cursor:pointer; display:flex; align-items:baseline; gap:8px;
}
.pop li .lnm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px}
.pop li .lmeta{font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:var(--fg-dim); text-transform:uppercase; flex:0 0 auto}
.pop li[aria-selected="true"]{background:var(--accent-soft-cur,var(--a-soft))}
.pop li.cursor{background:var(--bg-sunk)}
.pop li[aria-selected="true"].cursor{background:var(--accent-soft-cur,var(--a-soft)); box-shadow:inset 0 0 0 1px var(--accent-cur,var(--a))}
.pop .grouplab{
  padding:7px 9px 3px; font-family:var(--mono); font-size:9px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--fg-dim);
}
.pop .empty{padding:16px 10px; text-align:center; color:var(--fg-dim); font-size:12px}

/* ── stage ──────────────────────────────────────────────────── */
.stage{flex:1 1 auto; display:flex; min-width:0; gap:22px; padding:6px 22px 0; background:var(--bg)}
.pane{
  flex:1 1 50%; min-width:0; overflow-y:auto; overscroll-behavior:contain;
  position:relative; background:var(--paper); color:var(--pfg); border-radius:3px 3px 0 0;
  box-shadow:0 0 0 1px rgba(0,0,0,.05), 0 18px 40px -18px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.06);
  transition:box-shadow .2s;
}
/* the sheet being edited wears its pencil colour */
body[data-compare="on"] .pane{cursor:pointer}
body[data-compare="on"] .pane.editing{
  cursor:auto; box-shadow:0 0 0 2px var(--accent-cur), 0 18px 40px -18px rgba(0,0,0,.35);
}
body:not([data-compare="on"]) .pane[data-pair="b"]{display:none}

.pane[data-ground="light"]{
  --paper:#fbfbf8; --pfg:#161615; --pmid:#454542; --pdim:#686864;
  --pline:#e7e7e2; --prule:#cdcdc7;
}
.pane[data-ground="dark"]{
  --paper:#1a1a19; --pfg:#ececE7; --pmid:#adada7; --pdim:#8c8c86;
  --pline:#2b2b29; --prule:#454542;
}

.panetag{
  position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px;
  padding:6px 12px; backdrop-filter:blur(8px);
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  border-bottom:1px solid var(--pline);
  font-family:var(--mono); font-stretch:85%; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
}
body:not([data-compare="on"]) .panetag{display:none}
.panetag .dot{width:6px; height:6px; border-radius:50%; background:var(--accent-cur)}
.panetag .who{color:var(--accent-cur); font-weight:500}
.panetag .fonts{color:var(--pdim); text-transform:none; letter-spacing:.02em; font-size:10px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pane[data-pair="a"]{--accent-cur:var(--a); --accent-soft-cur:var(--a-soft)}
.pane[data-pair="b"]{--accent-cur:var(--b); --accent-soft-cur:var(--b-soft)}
/* pencils read lighter on ink so small accent text keeps its contrast */
.pane[data-ground="dark"][data-pair="a"]{--accent-cur:var(--a-ink)}
.pane[data-ground="dark"][data-pair="b"]{--accent-cur:var(--b-ink)}

/* type application */
.disp{
  font-family:var(--dsp-ff); font-weight:var(--dsp-w); font-style:var(--dsp-style);
  letter-spacing:var(--dsp-ls); line-height:var(--dsp-lh);
  font-variation-settings:var(--dsp-var); font-optical-sizing:var(--dsp-opsz);
  text-wrap:balance;
}
.bod{
  font-family:var(--bod-ff); font-weight:var(--bod-w); font-style:var(--bod-style);
  letter-spacing:var(--bod-ls); line-height:var(--bod-lh);
  font-variation-settings:var(--bod-var); font-optical-sizing:var(--bod-opsz);
}

/* ── view: editorial ────────────────────────────────────────── */
.ed{--ed-pad:40px; padding:56px var(--ed-pad) 150px; max-width:calc(var(--measure) + 12ch);
    margin:0 auto; font-size:var(--fs-body)}
/* body-size wrapper so every ch-based measure resolves in the same font */
.ed .mw,.ed .col{max-width:var(--measure); font-size:var(--fs-body)}
.ed .mw > p,.ed .mw > h1{max-width:none}
.ed .kicker{
  font-family:var(--bod-ff); font-weight:600; font-size:var(--fs-xs);
  letter-spacing:.15em; text-transform:uppercase; color:var(--accent-cur);
  margin:0 0 20px; display:flex; align-items:center; gap:10px;
}
.ed .kicker::after{content:""; flex:1; height:1px; background:var(--pline)}
.ed h1{margin:0 0 22px; font-size:var(--fs-h1); color:var(--pfg)}
.ed .deck{margin:0 0 26px; font-size:var(--fs-deck); color:var(--pmid); text-wrap:pretty}
.ed .byline{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; font-size:var(--fs-xs);
  color:var(--pdim); padding:12px 0 0; border-top:1px solid var(--pline); margin-bottom:40px;
}
.ed .byline strong{color:var(--pmid); font-weight:600}
.ed .byline .sep{width:3px; height:3px; border-radius:50%; background:var(--prule)}
.ed p{margin:0 0 1.05em; font-size:var(--fs-body); max-width:var(--measure); color:var(--pfg); text-wrap:pretty}
.ed .lede::first-letter{
  float:left; font-family:var(--dsp-ff); font-weight:var(--dsp-w); font-size:3.2em;
  line-height:.8; margin:.07em .09em -.02em 0; color:var(--accent-cur);
}
.ed h2{margin:2.1em 0 .7em; font-size:var(--fs-h2); color:var(--pfg); max-width:var(--measure)}
.ed h3{margin:1.7em 0 .5em; font-size:var(--fs-h3); color:var(--pfg); max-width:var(--measure)}
.ed blockquote{
  margin:2em 0; padding:0 0 0 22px; border-left:2px solid var(--accent-cur);
  font-size:var(--fs-h3); color:var(--pfg); max-width:var(--measure);
}
.ed blockquote p{font-size:inherit; margin:0}
.ed blockquote cite{
  display:block; margin-top:12px; font-family:var(--bod-ff); font-style:normal;
  font-size:var(--fs-xs); letter-spacing:.09em; text-transform:uppercase; color:var(--pdim);
}
.ed ul{margin:0 0 1.3em; padding-left:1.15em; max-width:var(--measure); font-size:var(--fs-body)}
.ed li{margin-bottom:.42em; padding-left:.2em}
.ed li::marker{color:var(--prule)}
.ed figure{margin:2.3em 0; max-width:var(--measure)}
.ed .stems{
  height:190px; display:flex; align-items:flex-end; gap:6%; padding:0 8%;
  border-bottom:1px solid var(--prule);
}
.ed .stem{flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end}
.ed .stem i{
  position:relative; display:block; width:2px; height:calc(var(--h) * 140px); background:var(--pmid); border-radius:1px;
}
.ed .stem i::before{
  content:""; position:absolute; top:-9px; left:50%; width:12px; height:12px; margin-left:-6px;
  border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--accent-cur);
}
.ed .stem span{
  font-family:var(--bod-ff); font-size:var(--fs-xs); color:var(--pdim);
  font-variant-numeric:tabular-nums lining-nums; padding-bottom:8px;
}
.ed figcaption{margin-top:10px; font-size:var(--fs-sm); color:var(--pmid); line-height:1.5}
.ed figcaption b{color:var(--pfg); font-weight:600}
.ed .stats{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px;
  background:var(--pline); border:1px solid var(--pline); margin:2.3em 0; max-width:var(--measure);
}
.ed .stats div{background:var(--paper); padding:14px 15px}
.ed .stats dt{
  font-family:var(--bod-ff); font-size:var(--fs-xs); letter-spacing:.11em; text-transform:uppercase;
  color:var(--pdim); margin-bottom:6px;
}
.ed .stats dd{
  margin:0; font-size:var(--fs-h3); color:var(--pfg); font-variant-numeric:tabular-nums lining-nums;
}
.ed .foot{
  margin-top:3em; padding-top:14px; border-top:1px solid var(--pline);
  font-size:var(--fs-sm); color:var(--pdim); line-height:1.55;
}
.ed .foot sup{color:var(--accent-cur); font-weight:600; margin-right:3px}
.ed em{font-style:italic}
.ed{position:relative}
</style>

<style>
/* ── view: mobile ───────────────────────────────────────────── */
.mob{padding:34px 26px 130px; display:flex; gap:26px; align-items:flex-start; overflow-x:auto; overscroll-behavior-x:contain}
.frame{flex:0 0 auto; width:375px}
.frame .cap{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--pdim); margin-bottom:9px; display:flex; align-items:center; gap:7px;
}
.frame .cap::after{content:""; flex:1; height:1px; background:var(--pline)}
.device{
  width:375px; height:734px; border:1px solid var(--prule); border-radius:26px;
  background:var(--paper); overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 1px 2px rgba(0,0,0,.07), 0 18px 40px -22px rgba(0,0,0,.35);
}
.statusbar{
  flex:0 0 auto; height:38px; display:flex; align-items:center; justify-content:space-between;
  padding:0 20px 0 22px; font-family:var(--bod-ff); font-size:12px; font-weight:600; color:var(--pfg);
  font-variant-numeric:tabular-nums;
}
.statusbar .sig{display:flex; gap:3px; align-items:flex-end}
.statusbar .sig i{display:block; width:3px; background:var(--pfg); border-radius:1px}
.statusbar .sig i:nth-child(1){height:4px}
.statusbar .sig i:nth-child(2){height:6px}
.statusbar .sig i:nth-child(3){height:8px}
.statusbar .sig i:nth-child(4){height:10px; opacity:.3}
.statusbar .batt{width:20px; height:10px; border:1px solid var(--pmid); border-radius:3px; position:relative}
.statusbar .batt::before{content:""; position:absolute; inset:1.5px; right:6px; background:var(--pfg); border-radius:1px}
.navbar{
  flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:6px 18px 12px;
  border-bottom:1px solid var(--pline);
}
.navbar .back{width:16px; height:16px; color:var(--pmid); flex:0 0 auto}
.navbar .ttl{
  flex:1; font-family:var(--bod-ff); font-size:var(--m-xs); font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--pmid);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.screen{flex:1 1 auto; overflow:hidden; position:relative}
.screen::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:56px; pointer-events:none;
  background:linear-gradient(to bottom,transparent,var(--paper));
}
.screen > .inner{padding:20px 22px 40px}

/* frame 1 — article */
.m-kick{
  font-family:var(--bod-ff); font-weight:600; font-size:var(--m-xs); letter-spacing:.15em;
  text-transform:uppercase; color:var(--accent-cur); margin:0 0 12px;
}
.m-h1{margin:0 0 12px; font-size:var(--m-h1); color:var(--pfg)}
.m-deck{margin:0 0 16px; font-size:var(--m-deck); color:var(--pmid); text-wrap:pretty}
.m-meta{
  display:flex; align-items:center; gap:8px; font-size:var(--m-xs); color:var(--pdim);
  padding-bottom:16px; border-bottom:1px solid var(--pline); margin-bottom:18px;
}
.m-meta .av{width:22px; height:22px; border-radius:50%; background:var(--accent-cur); opacity:.85; flex:0 0 auto}
.m-meta strong{color:var(--pmid); font-weight:600}
.m-body p{margin:0 0 .95em; font-size:var(--m-body); color:var(--pfg); text-wrap:pretty}
.m-h2{margin:1.5em 0 .5em; font-size:var(--m-h2); color:var(--pfg)}

/* frame 2 — index */
.m-secthead{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  margin:0 0 4px;
}
.m-secthead h2{margin:0; font-size:var(--m-h2); color:var(--pfg)}
.m-secthead .n{
  font-family:var(--bod-ff); font-size:var(--m-xs); letter-spacing:.1em; text-transform:uppercase;
  color:var(--pdim); font-variant-numeric:tabular-nums;
}
.m-sub{margin:0 0 20px; font-size:var(--m-sm); color:var(--pmid)}
.m-list{list-style:none; margin:0; padding:0}
.m-list li{padding:15px 0; border-top:1px solid var(--pline); display:flex; gap:13px; align-items:flex-start}
.m-list .idx{
  font-family:var(--bod-ff); font-size:var(--m-xs); color:var(--pdim); font-variant-numeric:tabular-nums lining-nums;
  padding-top:.35em; flex:0 0 20px;
}
.m-list .txt{flex:1 1 auto; min-width:0}
.m-list h3{margin:0 0 4px; font-size:var(--m-h3); color:var(--pfg); text-wrap:pretty}
.m-list .sub{
  margin:0; font-size:var(--m-xs); color:var(--pdim); display:flex; gap:7px; align-items:center;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.m-list .sub .sep{width:2.5px; height:2.5px; border-radius:50%; background:var(--prule); flex:0 0 auto}
.m-list .sub em{font-style:normal; color:var(--accent-cur)}

/* frame 3 — quote card */
.m-card{
  margin:6px 0 0; padding:30px 26px 26px; border:1px solid var(--pline); border-radius:3px;
  background:var(--paper); display:flex; flex-direction:column; gap:20px; min-height:430px;
}
.m-card .mark{
  font-family:var(--dsp-ff); font-weight:var(--dsp-w); font-size:56px; line-height:.5;
  color:var(--accent-cur); height:26px;
}
.m-card .q{margin:0; font-size:var(--m-quote); color:var(--pfg); text-wrap:pretty; flex:1 1 auto}
.m-card .attrib{
  padding-top:16px; border-top:1px solid var(--pline); font-size:var(--m-xs); color:var(--pdim);
  letter-spacing:.09em; text-transform:uppercase;
}
.m-card .attrib b{display:block; color:var(--pfg); font-weight:600; letter-spacing:.05em; margin-bottom:3px; text-transform:none; font-size:var(--m-sm)}
.m-actions{display:flex; gap:9px; margin-top:16px}
.m-actions button{
  flex:1; border:1px solid var(--pline); background:transparent; color:var(--pmid);
  border-radius:7px; padding:11px 10px; font-family:var(--bod-ff); font-size:var(--m-sm);
  font-weight:500; letter-spacing:var(--bod-ls);
}
.m-actions button.pri{background:var(--accent-cur); border-color:var(--accent-cur); color:var(--paper)}

/* ── view: specimen ─────────────────────────────────────────── */
.spec{padding:44px 40px 150px; max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:46px}
.spec section{display:flex; flex-direction:column; gap:16px}
.slab{
  font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--pdim); display:flex; align-items:center; gap:10px;
}
.slab::after{content:""; flex:1; height:1px; background:var(--pline)}
.slab b{color:var(--accent-cur); font-weight:500}

.faceblock{padding:4px 0 22px; border-bottom:1px solid var(--pline)}
.faceblock:last-child{border-bottom:0; padding-bottom:0}
.facehead{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:12px;
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--pdim);
  font-variant-numeric:tabular-nums;
}
.facehead .role{
  color:var(--accent-cur); letter-spacing:.13em; text-transform:uppercase; font-weight:500;
}
.facehead .fam{color:var(--pfg); font-family:var(--ui); font-size:12.5px; font-weight:500; letter-spacing:0}
.bigline{
  font-size:clamp(38px,5.8vw,82px); color:var(--pfg); margin:0;
  word-break:break-word; overflow-wrap:anywhere;
}
.bigline[contenteditable]:focus{outline:2px solid var(--accent-cur); outline-offset:6px; border-radius:2px}
.glyphs{margin:14px 0 0; font-size:19px; color:var(--pmid); line-height:1.7; word-spacing:.14em; overflow-wrap:anywhere}

.ladder{display:flex; flex-direction:column}
.rung{
  display:flex; align-items:baseline; gap:18px; padding:9px 0; border-bottom:1px solid var(--pline);
}
.rung:last-child{border-bottom:0}
.rung .k{
  flex:0 0 118px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--pdim); font-variant-numeric:tabular-nums; display:flex; gap:8px;
}
.rung .k i{font-style:normal; color:var(--prule)}
.rung .s{flex:1 1 auto; min-width:0; color:var(--pfg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.paras{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr)); gap:30px}
.paras .col{display:flex; flex-direction:column; gap:9px}
.paras .cl{
  font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--pdim);
  font-variant-numeric:tabular-nums;
}
.paras p{margin:0; color:var(--pfg)}

.mixgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:1px; background:var(--pline); border:1px solid var(--pline)}
.mixgrid .cell{background:var(--paper); padding:18px 18px 20px; display:flex; flex-direction:column; gap:7px}
.mixgrid .cell h4{margin:0; font-size:var(--fs-h3); color:var(--pfg)}
.mixgrid .cell p{margin:0; font-size:var(--fs-sm); color:var(--pmid)}
.mixgrid .cell .num{
  font-size:var(--fs-h2); color:var(--pfg); font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:var(--dsp-ls);
}

/* ── overlays ───────────────────────────────────────────────── */
.drop{
  position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
  background:color-mix(in srgb,var(--bg) 78%,transparent); backdrop-filter:blur(3px);
}
body[data-drag="on"] .drop{display:flex}
.drop .card{
  border:2px dashed var(--a); border-radius:14px; padding:36px 46px; text-align:center;
  background:var(--panel); box-shadow:var(--shadow); max-width:400px;
}
.drop .card b{display:block; font-size:15px; margin-bottom:7px}
.drop .card span{color:var(--fg-mid); font-size:12.5px; line-height:1.5; display:block}

.toast{
  position:fixed; bottom:calc(96px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(14px);
  z-index:220; background:var(--fg); color:var(--bg); padding:9px 16px; border-radius:8px;
  font-size:12.5px; font-weight:450; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
  max-width:min(520px,92vw); text-align:center;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

.sheet{
  position:fixed; inset:0; z-index:210; display:none; align-items:center; justify-content:center; padding:26px;
  background:color-mix(in srgb,var(--bg-sunk) 72%,transparent);
}
.sheet.on{display:flex}
.sheet .box{
  background:var(--panel); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow);
  width:min(680px,100%); max-height:82dvh; display:flex; flex-direction:column; overflow:hidden;
}
.sheet .box header{
  display:flex; align-items:center; gap:10px; padding:13px 15px; border-bottom:1px solid var(--line);
}
.sheet .box header b{font-size:13.5px; font-weight:600}
.sheet .box header .sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-dim)}
.sheet pre{
  margin:0; padding:16px; overflow:auto; flex:1 1 auto; font-family:var(--mono);
  font-size:11.5px; line-height:1.65; color:var(--fg); background:var(--bg-sunk); tab-size:2;
}
.sheet .box footer{display:flex; gap:8px; padding:11px 15px; border-top:1px solid var(--line); justify-content:flex-end}


/* ── responsive ─────────────────────────────────────────────── */
@media (max-width:900px){
  :root{--rail:290px}
  .ed{--ed-pad:20px; padding:32px var(--ed-pad) 130px}
  .spec{padding:30px 22px 130px; gap:34px}
}
@media (max-width:720px){
  .topbar{padding:0 12px; gap:10px}
  .brand a{display:none}
  .seg button{padding-inline:9px}
  #compareBtn{display:none}
  .stage{padding:4px 8px 0}
  body[data-compare="on"] .stage{flex-direction:column; gap:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}

<style>

.dock{
  position:fixed; z-index:80; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; padding:8px;
  background:var(--raised); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
  max-width:calc(100vw - 24px);
}
.dock .lab{font-family:var(--mono); font-stretch:85%; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-mid); padding-inline-start:4px}
.dock .div{width:1px; align-self:stretch; background:var(--line-soft); margin-inline:2px}
.dock .slotbox{width:220px}
.dock .combo .field-in{padding:8px 10px; border-radius:8px}
.dock .pop{top:auto; bottom:calc(100% + 10px); width:340px; right:auto}
.dock .seg{margin:0}
.pairseg button{display:inline-flex; align-items:center; gap:6px; font-weight:600}
.pairseg i{width:7px; height:7px; border-radius:50%; display:block}
body:not([data-compare="on"]) .pairseg{display:none}
.dockbtn{
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:transparent;
  color:var(--fg); border-radius:8px; padding:8px 13px; font-size:13px; white-space:nowrap;
  transition:scale .15s cubic-bezier(0.2, 0, 0, 1), background-color .13s, border-color .13s;
}
.dockbtn:hover{border-color:var(--fg-mid)}
.dockbtn:active,.btn:active{scale:.96}
.dockbtn.primary{background:var(--fg); color:var(--raised); border-color:var(--fg)}
.dockbtn.primary:hover{background:var(--solid-hover)}
.dockbtn[aria-expanded="true"]{background:var(--bg-sunk); border-color:var(--fg-mid)}
.dockbtn svg{width:14px; height:14px; flex:0 0 auto}

/* ── adjust: everything that is not a face pick ────────────── */
.adjust{
  position:fixed; z-index:79; left:50%; bottom:calc(92px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  width:min(580px, calc(100vw - 24px)); max-height:calc(100dvh - 170px); overflow-y:auto; overscroll-behavior:contain;
  background:var(--raised); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  padding:14px 18px 16px; display:grid; grid-template-columns:1fr 1fr; gap:14px 26px;
}
.adjust[hidden]{display:none}
.adjust{position:fixed}
.adjust > header{grid-column:1 / -1; display:flex; align-items:center; gap:8px; min-height:32px; margin-bottom:-4px}
body:not([data-compare="on"]) .adjust > header{position:absolute; top:10px; right:12px; min-height:0; margin:0}
.adjust > header .who{display:none; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--accent-cur)}
.adjust > header .who i{width:7px; height:7px; border-radius:50%; background:var(--accent-cur)}
body[data-compare="on"] .adjust > header .who{display:inline-flex}
.adjust > header .x{margin-inline-start:auto}
.adjtabs{display:none}
.adjust .sec{display:flex; flex-direction:column; gap:11px; min-width:0}
.adjust .sec > h4{margin:0 0 2px; font-family:var(--mono); font-stretch:85%; font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--fg)}
.adjust .sec[data-sec="scale"]{grid-column:1 / -1; display:grid; grid-template-columns:repeat(3, 1fr); gap:12px 20px; padding-top:14px; border-top:1px solid var(--line-soft)}
.adjust .sec[data-sec="scale"] > h4{grid-column:1 / -1}
.adjust .sec[data-sec="scale"] .val{white-space:nowrap}
.adjust > footer{grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px; padding-top:14px; border-top:1px solid var(--line-soft)}
.adjust > footer .field{width:200px}
.adjust > footer .sp{flex:1}
.adjust .customs{grid-column:1 / -1; display:flex; flex-direction:column; gap:6px}

/* ── picker: all fonts / pairings ──────────────────────────── */
.ptabs{display:flex; gap:2px; padding:6px 6px 0; border-bottom:1px solid var(--line-soft)}
.ptabs button{flex:1; border:0; background:transparent; padding:8px 8px 9px; font-size:12.5px; color:var(--fg-mid); border-bottom:2px solid transparent; margin-bottom:-1px}
.ptabs button[aria-pressed="true"]{color:var(--fg); border-bottom-color:var(--fg); font-weight:600}
.pop[data-tab="pairs"] > :is(.search, .filters, ul.fonts){display:none}
.pop:not([data-tab="pairs"]) > .plist{display:none}
.plist{list-style:none; margin:0; padding:4px; max-height:340px; overflow-y:auto}
.plist li{display:grid; grid-template-columns:1fr auto; gap:1px 12px; padding:9px 10px; border-radius:7px; cursor:pointer}
.plist li:hover,.plist li.cursor{background:var(--bg-sunk)}
.plist b{font-size:17px; font-weight:600; color:var(--fg); line-height:1.2}
.plist span{grid-column:1; font-size:13px; color:var(--fg-mid)}
.plist small{grid-column:2; grid-row:1 / span 2; align-self:center; font-family:var(--mono); font-stretch:85%; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-dim)}

/* ── share sheet ───────────────────────────────────────────── */
.share{display:flex; flex-direction:column; min-height:0; flex:1 1 auto; overflow:auto}
.share .row{padding:16px 16px 6px; display:flex; flex-direction:column; gap:10px}
.share .lead{margin:0; font-size:13.5px; color:var(--fg-mid)}

.share .linkrow input{flex:1; min-width:0; font-family:var(--mono); font-size:11.5px}
.share h4{margin:14px 16px 8px; font-family:var(--mono); font-stretch:85%; font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--fg)}
.share pre{flex:0 0 auto; max-height:38dvh}
.share .fine{margin:0; padding:10px 16px 14px; font-size:12px; color:var(--fg-dim)}

/* ── phone ─────────────────────────────────────────────────── */
@media (max-width:720px){
  .dock{left:8px; right:8px; transform:none; max-width:none; bottom:calc(8px + env(safe-area-inset-bottom)); gap:6px; padding:6px; border-radius:14px}
  .dock .lab,.dock .div,.dockbtn span{display:none}
  .dock .slotbox{width:auto; flex:1 1 0; min-width:0}

  .adjtabs{display:flex; gap:2px; grid-column:1 / -1; padding-inline-end:44px}
  .adjtabs button{flex:1; border:0; background:transparent; padding:7px 4px 8px; font-size:13px; color:var(--fg-mid); border-bottom:2px solid transparent}
  .adjtabs button[aria-pressed="true"]{color:var(--fg); border-bottom-color:var(--fg); font-weight:600}
  .adjust .sec{display:none}
  .adjust[data-sec="dsp"] .sec[data-sec="dsp"],.adjust[data-sec="bod"] .sec[data-sec="bod"]{display:flex}
  .adjust .sec[data-sec="scale"]{display:none; grid-template-columns:1fr; padding-top:0; border-top:0}

  .topbar .seg[aria-label="View"] button{flex:1}
}

<script>
"use strict";
const CAT_SHORT = {"Sans Serif":"Sans","Serif":"Serif","Display":"Display","Monospace":"Mono","Handwriting":"Script"};
const FALLBACK = {
  "Serif":'Georgia,"Times New Roman",serif',
  "Sans Serif":'"Helvetica Neue",Arial,sans-serif',
  "Monospace":'ui-monospace,Menlo,monospace',
  "Display":'Georgia,serif',
  "Handwriting":'cursive'
};
const CUSTOM_CAT = "Sans Serif";

const CATALOG = new Map();
GF.fonts.forEach(r => CATALOG.set(r[0], {
  name:r[0], cat:GF.cats[r[1]], w:r[2], ital:!!r[3], axes:r[4], pop:r[5], custom:false
}));
function fdata(n){ return CATALOG.get(n) || {name:n, cat:CUSTOM_CAT, w:[400], ital:false, axes:[], pop:1e6, custom:true}; }
function axisOf(f,t){ return f.axes.find(a => a[0] === t) || null; }
function axisLabel(t){ return GF.axisNames[t] || t; }

/* ── Google Fonts css2 URL ─────────────────────────────────── */
function gfUrl(f){
  const fam = f.name.replace(/ /g, "+");
  const cont = f.axes.filter(a => a[0] !== "ital");
  const disc = [];
  if (f.ital) disc.push(["ital", [0, 1]]);
  if (!axisOf(f, "wght") && f.w.length > 1) disc.push(["wght", f.w]);
  const tags = [...cont.map(a => a[0]), ...disc.map(d => d[0])].sort();
  if (!tags.length) return `https://fonts.googleapis.com/css2?family=${fam}&display=swap`;
  let tuples = [[]];
  tags.forEach(t => {
    const d = disc.find(x => x[0] === t);
    if (d){
      const next = [];
      tuples.forEach(row => d[1].forEach(v => next.push([...row, String(v)])));
      tuples = next;
    } else {
      const a = cont.find(x => x[0] === t);
      const v = a[1] === a[2] ? String(a[1]) : `${a[1]}..${a[2]}`;
      tuples = tuples.map(row => [...row, v]);
    }
  });
  const spec = tuples.map(r => r.join(",")).join(";");
  return `https://fonts.googleapis.com/css2?family=${fam}:${tags.join(",")}@${spec}&display=swap`;
}
const linked = new Set();
function ensureFont(name){
  if (linked.has(name)) return;
  linked.add(name);
  const f = CATALOG.get(name);
  if (!f) return;                      // custom fonts are already registered
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.href = gfUrl(f);
  document.head.appendChild(l);
}

/* ── state ─────────────────────────────────────────────────── */
function makePair(preset){
  return {
    dsp:{fam:preset.d, w:preset.dw, ital:false, ls:preset.dls, lh:preset.dlh, ax:{}},
    bod:{fam:preset.b, w:preset.bw, ital:false, ls:0,          lh:1.62,      ax:{}},
    base:19, ratio:preset.ratio, step:4, measure:66, preset:preset.n
  };
}

/* ── type scale ────────────────────────────────────────────── */
function scale(base, ratio, step){
  const s = x => Math.round(base * Math.pow(ratio, x) * 10) / 10;
  return {
    h1:s(step),
    h2:s(Math.max(1, step - 2)),
    h3:s(Math.max(1, step - 3)),
    deck:s(1),
    body:base,
    sm:Math.max(12, s(-1)),
    xs:Math.max(10, s(-2))
  };
}
function sizes(p){ return scale(p.base, p.ratio, p.step); }
function msizes(p){
  const b = Math.round(Math.min(19, Math.max(15, p.base * 0.9)) * 10) / 10;
  const st = Math.max(2, p.step - 1);
  const s = scale(b, p.ratio, st);
  return { h1:s.h1, h2:s.h2, h3:s.h3, deck:s.deck, body:b,
           sm:Math.max(12, s.sm), xs:Math.max(10, s.xs), quote:scale(b, p.ratio, Math.max(2, st - 1)).h1 };
}

/* ── slot → css ────────────────────────────────────────────── */
function stack(name){
  const f = fdata(name);
  return `"${name.replace(/"/g,"")}",${FALLBACK[f.cat] || FALLBACK["Sans Serif"]}`;
}
function clampWeight(slot){
  const f = fdata(slot.fam), ax = axisOf(f, "wght");
  if (ax) return Math.min(ax[2], Math.max(ax[1], slot.w));
  if (f.custom) return slot.w;
  return f.w.reduce((best, w) => Math.abs(w - slot.w) < Math.abs(best - slot.w) ? w : best, f.w[0]);
}
function varSettings(slot){
  const out = [];
  for (const [t, v] of Object.entries(slot.ax)){
    if (v === null || v === undefined || t === "wght" || t === "ital") continue;
    out.push(`"${t}" ${v}`);
  }
  return out.length ? out.join(",") : "normal";
}
function opticalSizing(slot){
  return (slot.ax.opsz !== undefined && slot.ax.opsz !== null) ? "none" : "auto";
}
function slotVars(prefix, slot){
  return [
    `--${prefix}-ff:${stack(slot.fam)}`,
    `--${prefix}-w:${clampWeight(slot)}`,
    `--${prefix}-style:${slot.ital ? "italic" : "normal"}`,
    `--${prefix}-ls:${slot.ls}em`,
    `--${prefix}-lh:${slot.lh}`,
    `--${prefix}-var:${varSettings(slot)}`,
    `--${prefix}-opsz:${opticalSizing(slot)}`
  ].join(";");
}
function paneCSS(id, p){
  const z = sizes(p), m = msizes(p);
  return `#${id}{${slotVars("dsp", p.dsp)};${slotVars("bod", p.bod)};` +
    `--fs-h1:${z.h1}px;--fs-h2:${z.h2}px;--fs-h3:${z.h3}px;--fs-deck:${z.deck}px;` +
    `--fs-body:${z.body}px;--fs-sm:${z.sm}px;--fs-xs:${z.xs}px;` +
    `--m-h1:${m.h1}px;--m-h2:${m.h2}px;--m-h3:${m.h3}px;--m-deck:${m.deck}px;` +
    `--m-body:${m.body}px;--m-sm:${m.sm}px;--m-xs:${m.xs}px;--m-quote:${m.quote}px;` +
    `--measure:${p.measure}ch;--measure-label:"${p.measure}ch"}`;
}

  ensureFont(S.pairs.a.dsp.fam); ensureFont(S.pairs.a.bod.fam);
  ensureFont(S.pairs.b.dsp.fam); ensureFont(S.pairs.b.bod.fam);

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const body = document.body;

function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2400);
}

/* ── custom font loading ───────────────────────────────────── */
const WOFF2_KNOWN = ["cmap","head","hhea","hmtx","maxp","name","OS/2","post","cvt ","fpgm","glyf","loca","prep","CFF ","VORG","EBDT","EBLC","gasp","hdmx","kern","LTSH","PCLT","VDMX","vhea","vmtx","BASE","GDEF","GPOS","GSUB","EBSC","JSTF","MATH","CBDT","CBLC","COLR","CPAL","SVG ","sbix","acnt","avar","bdat","bloc","bsln","cvar","fdsc","feat","fmtx","fvar","gvar","hsty","just","lcar","mort","morx","opbd","prop","trak","Zapf","Silf","Glat","Gloc","Feat","Sill"];
const tag4 = (dv,o) => String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));
const fx = (dv,o) => Math.round((dv.getInt32(o)/65536) * 100) / 100;

function readFvar(dv, off){
  const axesOff = off + dv.getUint16(off + 4);
  const count = dv.getUint16(off + 8), size = dv.getUint16(off + 10), out = [];
  for (let i = 0; i < count; i++){
    const o = axesOff + i * size;
    if (dv.getUint16(o + 16) & 1) continue;               // hidden axis
    out.push([tag4(dv, o), fx(dv, o + 4), fx(dv, o + 12), fx(dv, o + 8)]);
  }
  return out;
}
async function inflate(u8){
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function inspectFont(buf){
  try{
    const dv = new DataView(buf), sig = tag4(dv, 0);
    if (sig === "wOFF"){
      const n = dv.getUint16(12);
      for (let i = 0; i < n; i++){
        const o = 44 + i * 20;
        if (tag4(dv, o) !== "fvar") continue;
        const off = dv.getUint32(o + 4), comp = dv.getUint32(o + 8), orig = dv.getUint32(o + 12);
        let u8 = new Uint8Array(buf, off, comp);
        if (comp < orig) u8 = await inflate(u8);
        const d = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
        return { variable:true, axes:readFvar(d, 0), exact:true };
      }
      return { variable:false, axes:[], exact:true };
    }
    if (sig === "wOF2"){
      const n = dv.getUint16(12); const st = { p:48 };
      const u128 = () => { let v = 0; for (let i = 0; i < 5; i++){ const b = dv.getUint8(st.p++); v = (v << 7) | (b & 0x7f); if (!(b & 0x80)) break; } return v >>> 0; };
      for (let i = 0; i < n; i++){
        const flags = dv.getUint8(st.p++); const known = flags & 0x3f;
        let tg;
        if (known === 0x3f){ tg = tag4(dv, st.p); st.p += 4; } else tg = WOFF2_KNOWN[known] || "????";
        u128();                                             // origLength
        const tv = flags >> 6;
        const transformed = (tg === "glyf" || tg === "loca") ? (tv === 0) : (tv !== 0);
        if (transformed) u128();                            // transformLength
        if (tg === "fvar") return { variable:true, axes:[], exact:false };
      }
      return { variable:false, axes:[], exact:true };
    }
    if (sig === "ttcf") return { variable:false, axes:[], exact:false };
    const n = dv.getUint16(4);
    for (let i = 0; i < n; i++){
      const o = 12 + i * 16;
      if (tag4(dv, o) === "fvar") return { variable:true, axes:readFvar(dv, dv.getUint32(o + 8)), exact:true };
    }
    return { variable:false, axes:[], exact:true };
  } catch(e){ return { variable:false, axes:[], exact:false }; }
}

function cleanName(fn){
  return fn.replace(/\.(woff2?|otf|ttf)$/i, "").replace(/[\[\]"]/g, "")
           .replace(/[-_]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").trim() || "Custom font";
}
async function registerFont(name, buf, insp){
  const wa = insp.axes.find(a => a[0] === "wght");
  const desc = insp.variable ? { weight: wa ? `${wa[1]} ${wa[2]}` : "1 1000" } : {};
  const ff = new FontFace(name, buf, desc);
  await ff.load();
  document.fonts.add(ff);
  const axes = insp.axes.length ? insp.axes : (insp.variable ? [["wght",1,1000,400]] : []);
  CATALOG.set(name, { name, cat:CUSTOM_CAT, w:insp.variable ? [400] : [400], ital:false, axes, pop:-1, custom:true, exact:insp.exact });
  linked.add(name);
}
async function addFontFile(file){
  if (!/\.(woff2?|otf|ttf)$/i.test(file.name)) { toast(`${file.name} isn’t a font file — use .woff2, .woff, .otf or .ttf`); return null; }
  const buf = await file.arrayBuffer();
  const insp = await inspectFont(buf);
  let name = cleanName(file.name);
  while (CATALOG.has(name) && !S.customs.some(c => c.name === name)) name += " ";
  try { await registerFont(name, buf.slice(0), insp); }
  catch(e){ toast(`Couldn’t read ${file.name} — the file may be corrupt or an unsupported format`); return null; }
  S.customs = S.customs.filter(c => c.name !== name);
  S.customs.push({ name, b64:toB64(buf), insp });
  saveState();
  const note = insp.variable
    ? (insp.exact ? `${name} loaded — ${insp.axes.length} variable ${insp.axes.length === 1 ? "axis" : "axes"}`
                  : `${name} loaded — variable, but .woff2 hides its axis list, so only weight is adjustable`)
    : `${name} loaded — static face`;
  toast(note);
  return name;
}
function toB64(buf){
  const u8 = new Uint8Array(buf); let s = "";
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(b64){
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}

/* ── persistence ───────────────────────────────────────────── */
const KEY = "type-check-v1";
function saveState(){
  try{
    const customs = [];
    let budget = 3.4e6;
    for (const c of S.customs){ if (c.b64.length < budget){ customs.push(c); budget -= c.b64.length; } }
    localStorage.setItem(KEY, JSON.stringify({
      view:S.view, compare:S.compare, active:S.active, ground:S.ground,
      lang:S.lang, big:S.big, pairs:S.pairs, customs
    }));
  } catch(e){ /* private window, quota, blocked storage — the tool still works */ }
  writeHash();
}
async function loadState(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ return; }
  if (!raw) return;
  let d; try { d = JSON.parse(raw); } catch(e){ return; }
  for (const c of (d.customs || [])){
    try { await registerFont(c.name, fromB64(c.b64), c.insp); S.customs.push(c); } catch(e){}
  }
  ["view","compare","active","ground","lang","big"].forEach(k => { if (d[k] !== undefined) S[k] = d[k]; });
  if (d.pairs && d.pairs.a && d.pairs.b) S.pairs = d.pairs;
}

/* ── font picker ───────────────────────────────────────────── */
let previewQueue = new Set(), previewTimer = null;
const previewed = new Set();
function queuePreview(name){
  if (previewed.has(name) || linked.has(name) || !CATALOG.get(name) || CATALOG.get(name).custom) return;
  previewQueue.add(name);
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    const batch = Array.from(previewQueue).slice(0, 24);
    previewQueue = new Set(Array.from(previewQueue).slice(24));
    if (!batch.length) return;
    batch.forEach(n => previewed.add(n));
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?" + batch.map(n => "family=" + n.replace(/ /g, "+")).join("&") + "&text=" + encodeURIComponent("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 &-.") + "&display=swap";
    document.head.appendChild(l);
    if (previewQueue.size) queuePreview(Array.from(previewQueue)[0]);
  }, 90);
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) queuePreview(e.target.dataset.fam); }), { rootMargin:"140px" });

const pickerMemo = { dsp:{ q:"", cat:"all" }, bod:{ q:"", cat:"all" } };
function buildCombo(slotKey, label){
  const p = S.pairs[S.active], slot = p[slotKey];
  const wrap = document.createElement("div");
  wrap.className = "combo"; wrap.dataset.slot = slotKey;
  const f = fdata(slot.fam);
  wrap.innerHTML = `
    <button type="button" class="field-in" aria-haspopup="listbox" aria-expanded="false">
      <span class="nm">${esc(slot.fam)}</span><span class="cat">${esc(CAT_SHORT[f.cat] || f.cat)}</span>
    </button>
    <div class="pop" role="dialog" aria-label="Choose a ${label} face">
      <div class="ptabs" role="group" aria-label="Show"><button type="button" data-t="fonts" aria-pressed="true">All fonts</button><button type="button" data-t="pairs" aria-pressed="false">Pairings</button></div>
      <div class="search"><input type="text" placeholder="Search 1,600+ families…" aria-label="Search families" autocomplete="off" spellcheck="false"></div>
      <div class="filters"></div>
      <ul class="fonts" role="listbox" tabindex="-1"></ul>
      <ul class="plist" role="listbox" aria-label="Starting pairings">${PRESETS.map((pr, i) =>
        `<li role="option" data-i="${i}"><b style="font-family:'${pr.d}',serif">${esc(pr.d)}</b><span style="font-family:'${pr.b}',sans-serif">${esc(pr.b)}</span><small>${esc(pr.n)}</small></li>`).join("")}</ul>
    </div>`;
  const btn = wrap.querySelector(".field-in"), pop = wrap.querySelector(".pop");
  const input = wrap.querySelector("input"), list = wrap.querySelector("ul.fonts"), filters = wrap.querySelector(".filters");
  const memo = pickerMemo[slotKey];
  let cat = memo.cat, cursor = 0, rows = [];

  wrap.querySelectorAll(".ptabs button").forEach(t => t.onclick = e => {
    e.stopPropagation();
    pop.dataset.tab = t.dataset.t;
    wrap.querySelectorAll(".ptabs button").forEach(x => x.setAttribute("aria-pressed", String(x === t)));
    if (t.dataset.t === "pairs") PRESETS.forEach(pr => { ensureFont(pr.d); ensureFont(pr.b); });
    else input.focus();
  });
  wrap.querySelectorAll(".plist li").forEach(li => li.onclick = () => {
    const pr = PRESETS[+li.dataset.i];
    S.pairs[S.active] = makePair(pr);
    close(); commit(true); track("pairing_pick");
    toast(`Pair ${S.active.toUpperCase()}: ${pr.n} (${pr.why})`);
  });

  ["all", ...GF.cats].forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pill"; b.textContent = c === "all" ? "All" : (CAT_SHORT[c] || c);
    b.setAttribute("aria-pressed", String(c === cat));
    b.onclick = () => { cat = memo.cat = c; filters.querySelectorAll(".pill").forEach(x => x.setAttribute("aria-pressed", String(x === b))); draw(); };
    filters.appendChild(b);
  });

  function matches(){
    const q = input.value.trim().toLowerCase();
    const all = [...S.customs.map(c => CATALOG.get(c.name)).filter(Boolean), ...GF.fonts.map(r => CATALOG.get(r[0]))];
    return all.filter(f => f && (cat === "all" || f.cat === cat || (f.custom && cat === CUSTOM_CAT))
                             && (!q || f.name.toLowerCase().includes(q)));
  }
  function draw(){
    const all = matches();
    rows = all.slice(0, 220);
    cursor = Math.max(0, rows.findIndex(f => f.name === S.pairs[S.active][slotKey].fam));
    io.disconnect();
    list.innerHTML = "";
    if (!rows.length){ list.innerHTML = `<li class="empty" role="presentation">No family matches “${esc(input.value)}”${cat !== "all" ? " in this category. Try All." : ". Try part of the name."}</li>`; return; }
    let didCustomLabel = false, didGFLabel = false;
    rows.forEach((f, i) => {
      if (f.custom && !didCustomLabel){ didCustomLabel = true; list.insertAdjacentHTML("beforeend", `<li class="grouplab" role="presentation">Your fonts</li>`); }
      if (!f.custom && !didGFLabel && didCustomLabel){ didGFLabel = true; list.insertAdjacentHTML("beforeend", `<li class="grouplab" role="presentation">Google Fonts</li>`); }
      const li = document.createElement("li");
      li.setAttribute("role","option"); li.dataset.fam = f.name; li.dataset.i = String(i);
      li.setAttribute("aria-selected", String(f.name === S.pairs[S.active][slotKey].fam));
      if (i === cursor) li.classList.add("cursor");
      const meta = f.custom ? "yours" : (f.axes.length ? "var" : (CAT_SHORT[f.cat] || f.cat));
      li.innerHTML = `<span class="lnm" style="font-family:'${f.name.replace(/'/g,"")}',${FALLBACK[f.cat]}">${esc(f.name)}</span><span class="lmeta">${esc(meta)}</span>`;
      li.onclick = () => pick(f.name);
      list.appendChild(li);
      if (!f.custom) io.observe(li);
    });
    if (all.length > rows.length) list.insertAdjacentHTML("beforeend", `<li class="grouplab" role="presentation">${all.length - rows.length} more — keep typing to narrow</li>`);
    const cur = list.querySelector(".cursor"); if (cur) cur.scrollIntoView({ block:"nearest" });
  }
  function pick(name){
    const p = S.pairs[S.active];
    p[slotKey].fam = name;
    p[slotKey].ax = {};
    p[slotKey].w = clampWeight(p[slotKey]);
    if (!fdata(name).ital) p[slotKey].ital = false;
    p.preset = null;
    close(); commit(true); track("font_pick");
  }
  function open(){
    $$(".combo.open").forEach(c => { if (c !== wrap) c.classList.remove("open"); });
    wrap.classList.add("open"); btn.setAttribute("aria-expanded", "true");
    input.value = memo.q; draw(); input.focus(); input.select();
  }
  function close(){ wrap.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
  btn.onclick = () => wrap.classList.contains("open") ? close() : open();
  input.oninput = () => { memo.q = input.value; draw(); };
  input.onkeydown = e => {
    if (e.key === "Escape"){ close(); btn.focus(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      cursor = Math.min(rows.length - 1, Math.max(0, cursor + (e.key === "ArrowDown" ? 1 : -1)));
      list.querySelectorAll("li[data-i]").forEach(li => li.classList.toggle("cursor", +li.dataset.i === cursor));
      const cur = list.querySelector(".cursor"); if (cur) cur.scrollIntoView({ block:"nearest" });
    }
    else if (e.key === "Enter"){ e.preventDefault(); if (rows[cursor]) pick(rows[cursor].name); }
  };
  return wrap;
}
</script>

<script>
"use strict";

/* ── control primitives ────────────────────────────────────── */
function el(tag, cls, html){ const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }

function mkRange(o){
  const f = el("div", "field");
  const head = el("div", "rowhead");
  const lab = el("span", "rowlab"); lab.textContent = o.label;
  const val = el("span", "val"); val.textContent = o.value === null ? "auto" : o.fmt(o.value);
  head.append(lab, val);
  let reset = null;
  if (o.onReset){
    reset = el("button", "reset"); reset.type = "button"; reset.textContent = "auto";
    reset.title = "Return this axis to the font\u2019s own default";
    reset.hidden = o.value === null;
    reset.onclick = o.onReset; head.insertBefore(reset, val);
  }
  const inp = document.createElement("input");
  inp.type = "range"; inp.min = o.min; inp.max = o.max; inp.step = o.step;
  inp.value = o.value === null ? o.def : o.value;
  inp.setAttribute("aria-label", o.label);
  if (o.value === null) val.classList.add("auto");
  inp.oninput = () => { val.classList.remove("auto"); if (reset) reset.hidden = false; val.textContent = o.fmt(+inp.value); o.onInput(+inp.value); };
  f.append(head, inp);
  return f;
}
function mkSelect(label, opts, value, onChange){
  const f = el("div", "field");
  const l = document.createElement("label"); l.textContent = label;
  const s = document.createElement("select");
  opts.forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; if (String(v) === String(value)) o.selected = true; s.appendChild(o); });
  const id = "sel-" + Math.random().toString(36).slice(2, 8); s.id = id; l.htmlFor = id;
  s.onchange = () => onChange(s.value);
  f.append(l, s); return f;
}
function mkGroup(title, tag, open){
  const d = el("details", "grp"); d.open = !!open;
  const s = el("summary", null,
    `<svg class="chev" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 2l3 3-3 3"/></svg>` +
    `<span>${esc(title)}</span>` + (tag ? `<span class="tag">${esc(tag)}</span>` : ""));
  d.appendChild(s);
  const b = el("div", "grpbody"); d.appendChild(b);
  return [d, b];
}

const px = v => v + "px";
const em = v => (v > 0 ? "+" : "") + v.toFixed(3).replace(/0+$/, "").replace(/\.$/, "") + "em";

function slotControls(box, slotKey, isBody){
  const p = S.pairs[S.active], slot = p[slotKey], f = fdata(slot.fam);

  const wa = axisOf(f, "wght");
  if (wa){
    box.appendChild(mkRange({ label:"Weight", min:wa[1], max:wa[2], step:1, value:clampWeight(slot),
      fmt:v => String(Math.round(v)), onInput:v => { slot.w = Math.round(v); p.preset = null; light(); } }));
  } else if (f.w.length > 1){
    box.appendChild(mkSelect("Weight", f.w.map(w => [w, String(w)]), clampWeight(slot),
      v => { slot.w = +v; p.preset = null; commit(false); }));
  } else {
    const n = el("div", "field", `<span class="rowlab">Weight</span><span class="hint">${f.custom ? "Static file — one weight" : "Single weight (" + f.w[0] + ")"}</span>`);
    box.appendChild(n);
  }

  if (f.ital){
    const row = el("div", "inline");
    const b = el("button", "pill"); b.type = "button"; b.textContent = "Italic";
    b.setAttribute("aria-pressed", String(slot.ital));
    b.onclick = () => { slot.ital = !slot.ital; b.setAttribute("aria-pressed", String(slot.ital)); p.preset = null; light(); };
    row.appendChild(b); box.appendChild(row);
  }

  box.appendChild(mkRange({ label:"Tracking", min:-0.07, max:0.16, step:0.005, value:slot.ls,
    fmt:em, onInput:v => { slot.ls = v; p.preset = null; light(); } }));
  box.appendChild(mkRange({ label:"Leading", min:isBody ? 1.1 : 0.8, max:isBody ? 2.2 : 1.7, step:0.01, value:slot.lh,
    fmt:v => v.toFixed(2), onInput:v => { slot.lh = v; p.preset = null; light(); } }));

  if (isBody){
    box.appendChild(mkRange({ label:"Measure", min:38, max:96, step:1, value:p.measure,
      fmt:v => v + "ch", onInput:v => { p.measure = Math.round(v); light(); } }));
  }

  const extra = f.axes.filter(a => a[0] !== "wght" && a[0] !== "ital");
  if (extra.length){
    const note = el("div", "field", `<span class="rowlab">Variable axes</span>`);
    box.appendChild(note);
    extra.forEach(a => {
      const [t, min, max] = a, def = a[3];
      const cur = slot.ax[t] === undefined ? null : slot.ax[t];
      const step = (max - min) <= 3 ? 0.01 : ((max - min) <= 60 ? 0.5 : 1);
      const ctl = mkRange({
        label: `${axisLabel(t)} · ${t}`, min, max, step, value:cur, def,
        fmt: v => (Math.round(v * 100) / 100).toString(),
        onInput: v => { slot.ax[t] = Math.round(v * 100) / 100; p.preset = null; light(); },
        onReset: () => { delete slot.ax[t]; p.preset = null; commit(true); }
      });
      box.appendChild(ctl);
    });
  } else if (f.custom && !f.exact){
    box.appendChild(el("div", "hint", "This .woff2 is variable, but the format hides its axis table — only weight can be driven from here."));
  }
}

/* ── dock + adjust ─────────────────────────────────────────── */
function buildControls(){
  const p = S.pairs[S.active];
  $("#slotDsp").replaceChildren(buildCombo("dsp", "display"));
  $("#slotBod").replaceChildren(buildCombo("bod", "text"));

  const adj = $("#adjust"), top = adj.scrollTop;
  const dsp = $("#secDsp"), bod = $("#secBod"), sc = $("#secScale"), foot = $("#adjFoot");
  dsp.innerHTML = "<h4>Display face</h4>"; slotControls(dsp, "dsp", false);
  bod.innerHTML = "<h4>Text face</h4>";    slotControls(bod, "bod", true);

  sc.innerHTML = "<h4>Scale</h4>";
  sc.appendChild(mkRange({ label:"Base size", min:14, max:26, step:.5, value:p.base, fmt:px,
    onInput:v => { p.base = v; light(); } }));
  sc.appendChild(mkSelect("Ratio", RATIOS.map(([v, n]) => [v, `${n} · ${v}`]), p.ratio,
    v => { p.ratio = +v; commit(false); }));
  sc.appendChild(mkRange({ label:"Display step", min:1, max:7, step:1, value:p.step,
    fmt:v => `${v} → ${sizes({ ...p, step:v }).h1}px`, onInput:v => { p.step = v; light(); } }));

  foot.innerHTML = "";
  foot.appendChild(mkSelect("Sample text", [["en", "English"], ["es", "Español: tildes, eñes, ¿¡"]], S.lang,
    v => { S.lang = v; S.big = null; commit(false); }));
  foot.appendChild(el("span", "sp"));
  const fi = document.createElement("input"); fi.type = "file"; fi.accept = ".woff2,.woff,.otf,.ttf"; fi.multiple = true;
  fi.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";
  fi.onchange = async () => { let last = null; for (const f of fi.files) last = (await addFontFile(f)) || last; fi.value = ""; if (last){ commit(true); track("font_file_added"); } };
  const add = el("button", "btn"); add.type = "button"; add.textContent = "Add font files…";
  add.title = "Your font files never leave this browser";
  add.onclick = () => fi.click();
  foot.append(fi, add);
  if (S.compare){
    const dup = el("button", "btn"); dup.type = "button";
    const other = S.active === "a" ? "B" : "A";
    dup.textContent = `Copy to ${other}`; dup.title = `Copy this pair into ${other}, then change one side`;
    dup.onclick = () => {
      S.pairs[S.active === "a" ? "b" : "a"] = JSON.parse(JSON.stringify(p));
      commit(true); toast(`Pair ${S.active.toUpperCase()} copied into ${other}. Now change one side.`);
    };
    foot.appendChild(dup);
  }
  const rst = el("button", "btn"); rst.type = "button"; rst.textContent = "Reset pair";
  rst.onclick = () => { S.pairs[S.active] = makePair(PRESETS[S.active === "a" ? 0 : 6]); commit(true); };
  foot.appendChild(rst);
  if (S.customs.length){
    const box = el("div", "customs");
    S.customs.forEach(c => {
      const row = el("div", "inline");
      row.style.cssText = "justify-content:space-between;gap:8px";
      const nm = el("span"); nm.textContent = c.name; nm.style.cssText = "flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px";
      const x = el("button", "reset"); x.type = "button"; x.textContent = "remove";
      x.onclick = () => {
        S.customs = S.customs.filter(v => v.name !== c.name);
        ["a", "b"].forEach(k => ["dsp", "bod"].forEach(s => { if (S.pairs[k][s].fam === c.name) S.pairs[k][s].fam = PRESETS[0][s === "dsp" ? "d" : "b"]; }));
        CATALOG.delete(c.name); commit(true);
      };
      row.append(nm, x); box.appendChild(row);
    });
    foot.appendChild(box);
  }

  adj.scrollTop = top;
  const acc = S.active === "a" ? "var(--a)" : "var(--b)", soft = S.active === "a" ? "var(--a-soft)" : "var(--b-soft)";
  [adj, $(".dock")].forEach(n => { n.style.setProperty("--accent-cur", acc); n.style.setProperty("--accent-soft-cur", soft); });
}

/* ── commit ────────────────────────────────────────────────── */
let rafId = 0, saveT = 0;
function light(){
  applyStyles();
  if (S.view === "specimen" && !(document.activeElement && document.activeElement.classList.contains("bigline"))){
    cancelAnimationFrame(rafId); rafId = requestAnimationFrame(renderPanes);
  }
  clearTimeout(saveT); saveT = setTimeout(saveState, 400);
}
function commit(rebuild){
  applyStyles(); renderPanes(); syncChrome();
  if (rebuild) buildControls();
  saveState();
}
function syncChrome(){
  body.dataset.compare = S.compare ? "on" : "off";
  $$("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === S.view)));
  $$(".pairseg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === S.active)));
  $$(".pane").forEach(p => p.classList.toggle("editing", S.compare && p.dataset.pair === S.active));
  $("#adjWho").textContent = "Pair " + S.active.toUpperCase();
  $("#compareBtn").setAttribute("aria-pressed", String(S.compare));
  $("#groundLight").setAttribute("aria-pressed", String(S.ground === "light"));
  $("#groundDark").setAttribute("aria-pressed", String(S.ground === "dark"));
  $$(".pane").forEach(p => p.dataset.ground = S.ground);
  const adj = $("#adjust");
  adj.dataset.sec = S.sec;
  $$(".adjtabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sec === S.sec)));
}
</script>

<script>
"use strict";

/* ── CSS export ────────────────────────────────────────────── */
function combinedImport(p){
  const fams = [...new Set([p.dsp.fam, p.bod.fam])].filter(n => CATALOG.get(n) && !CATALOG.get(n).custom);
  if (!fams.length) return null;
  const parts = fams.map(n => { const u = gfUrl(CATALOG.get(n)); return u.slice(u.indexOf("family="), u.indexOf("&display")); });
  return `https://fonts.googleapis.com/css2?${parts.join("&")}&display=swap`;
}
function pairCSS(key){
  const p = S.pairs[key], z = sizes(p), m = msizes(p);
  const rn = (RATIOS.find(r => r[0] === p.ratio) || [p.ratio, "custom"])[1];
  const imp = combinedImport(p);
  const locals = [p.dsp.fam, p.bod.fam].filter(n => CATALOG.get(n) && CATALOG.get(n).custom);
  const vs = s => varSettings(s) === "normal" ? "" : `\n  font-variation-settings: ${varSettings(s)};`;
  const it = s => s.ital ? "\n  font-style: italic;" : "";
  return `/* Pair ${key.toUpperCase()}${p.preset ? " — " + p.preset : ""} · ${p.dsp.fam} + ${p.bod.fam} */
${imp ? `@import url("${imp}");` : ""}${locals.length ? `\n/* Load locally, not on Google Fonts: ${locals.join(", ")} */` : ""}

:root {
  --font-display: ${stack(p.dsp.fam)};
  --font-text: ${stack(p.bod.fam)};

  /* ${rn} · ${p.ratio}, from a ${p.base}px base */
  --text-h1: ${z.h1}px;
  --text-h2: ${z.h2}px;
  --text-h3: ${z.h3}px;
  --text-deck: ${z.deck}px;
  --text-body: ${z.body}px;
  --text-small: ${z.sm}px;
  --text-caption: ${z.xs}px;

  /* mobile */
  --text-h1-sm: ${m.h1}px;
  --text-h2-sm: ${m.h2}px;
  --text-body-sm: ${m.body}px;

  --measure: ${p.measure}ch;
}

h1, h2, h3, .display {
  font-family: var(--font-display);
  font-weight: ${clampWeight(p.dsp)};
  letter-spacing: ${p.dsp.ls}em;
  line-height: ${p.dsp.lh};${it(p.dsp)}${vs(p.dsp)}
  text-wrap: balance;
}

body, .text {
  font-family: var(--font-text);
  font-weight: ${clampWeight(p.bod)};
  font-size: var(--text-body);
  letter-spacing: ${p.bod.ls}em;
  line-height: ${p.bod.lh};${it(p.bod)}${vs(p.bod)}
}

p { max-width: var(--measure); text-wrap: pretty; }
`;
}
let sheetReturn = null;
function openSheet(title, sub, node){
  sheetReturn = document.activeElement;
  $$(".app, .dock, .adjust").forEach(n => n.inert = true);
  $("#sheetTitle").textContent = title;
  $("#sheetSub").textContent = sub || "";
  const b = $("#sheetBody"); b.innerHTML = ""; b.appendChild(node);
  const s = $("#sheet"); s.hidden = false; s.classList.add("on");
  $("#sheetClose").focus();
}
function closeSheet(){
  const s = $("#sheet"); s.classList.remove("on"); s.hidden = true;
  $$(".app, .dock, .adjust").forEach(n => n.inert = false);
  if (sheetReturn && sheetReturn.focus) sheetReturn.focus();
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.cssText = "position:fixed;top:-200vh;left:0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_){}
    ta.remove(); return ok;
  }
}
function shareURL(){
  return location.origin + location.pathname + "?ref=share#" + encodeHash();
}
function showShare(){
  const keys = S.compare ? ["a", "b"] : [S.active];
  const text = keys.map(pairCSS).join("\n\n");
  const url = shareURL();
  const wrap = el("div", "share");
  const row = el("div", "row");
  row.appendChild(el("p", "lead", keys.length > 1 ? "Anyone with this link sees both pairs exactly like this." : "Anyone with this link sees this pair exactly like this."));
  const lr = el("div", "linkrow");
  const inp = document.createElement("input"); inp.type = "text"; inp.readOnly = true; inp.value = url; inp.setAttribute("aria-label", "Share link");
  inp.onfocus = () => inp.select();
  const cl = el("button", "btn primary"); cl.type = "button"; cl.textContent = "Copy link";
  cl.onclick = async () => { const ok = await copyText(url); toast(ok ? "Link copied" : "Couldn’t reach the clipboard. Select the link and copy it."); if (ok) track("copy_link"); };
  lr.append(inp, cl); row.appendChild(lr);
  const locals = keys.flatMap(k => [S.pairs[k].dsp.fam, S.pairs[k].bod.fam]).filter(n => fdata(n).custom);
  if (locals.length) row.appendChild(el("p", "hint", `${[...new Set(locals)].map(esc).join(", ")} came from your computer, so other people will see a fallback face.`));
  wrap.appendChild(row);
  wrap.appendChild(el("h4", null, keys.length > 1 ? "CSS for both pairs" : "CSS"));
  const pre = document.createElement("pre"); pre.textContent = text; pre.tabIndex = 0;
  const foot = el("footer");
  const cc = el("button", "btn"); cc.type = "button"; cc.textContent = "Copy CSS";
  cc.onclick = async () => { const ok = await copyText(text); toast(ok ? "CSS copied" : "Couldn’t reach the clipboard. Select the text and copy it."); if (ok) track("copy_css"); };
  foot.appendChild(cc);
  wrap.append(pre, foot);
  if (CLARITY_ID) wrap.appendChild(el("p", "fine", "Anonymous usage stats via Microsoft Clarity, no cookies. Your font files never leave this browser."));
  openSheet("Share", keys.length > 1 ? "Pairs A and B" : "Pair " + keys[0].toUpperCase(), wrap);
  track("share_open");
}

/* ── share link: the whole setup lives in the URL hash ───────── */
const slotOut = s => [s.fam, s.w, s.ital ? 1 : 0, s.ls, s.lh, s.ax];
const pairOut = p => [slotOut(p.dsp), slotOut(p.bod), p.base, p.ratio, p.step, p.measure];
function encodeHash(){
  const d = { v:1, a:pairOut(S.pairs.a), view:S.view, g:S.ground, l:S.lang, x:S.active };
  if (S.compare){ d.b = pairOut(S.pairs.b); d.c = 1; }
  const bytes = new TextEncoder().encode(JSON.stringify(d));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function readHash(){
  const h = location.hash.slice(1);
  if (!h) return false;
  try{
    const bin = atob(h.replace(/-/g, "+").replace(/_/g, "/"));
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if (d.v !== 1 || !Array.isArray(d.a)) return false;
    const num = (v, lo, hi, def) => (typeof v === "number" && v >= lo && v <= hi) ? v : def;
    const slotIn = (a, def) => (Array.isArray(a) && typeof a[0] === "string") ? {
      fam:a[0].slice(0, 80), w:num(a[1], 1, 1000, def.w), ital:!!a[2], ls:num(a[3], -0.2, 0.3, def.ls),
      lh:num(a[4], 0.5, 3, def.lh), ax:(a[5] && typeof a[5] === "object") ? a[5] : {} } : def;
    const pairIn = (a, def) => Array.isArray(a) ? {
      dsp:slotIn(a[0], def.dsp), bod:slotIn(a[1], def.bod), base:num(a[2], 10, 40, def.base),
      ratio:num(a[3], 1, 2, def.ratio), step:num(a[4], 1, 8, def.step), measure:num(a[5], 20, 120, def.measure), preset:null } : def;
    S.pairs.a = pairIn(d.a, makePair(PRESETS[0]));
    if (d.b) S.pairs.b = pairIn(d.b, makePair(PRESETS[6]));
    S.compare = !!d.c;
    if (["editorial", "mobile", "specimen"].includes(d.view)) S.view = d.view;
    if (d.g === "light" || d.g === "dark") S.ground = d.g;
    if (d.l === "en" || d.l === "es") S.lang = d.l;
    S.active = (d.x === "b" && S.compare) ? "b" : "a";
    return true;
  } catch(e){ return false; }
}
let hashT = 0;
function writeHash(){
  clearTimeout(hashT);
  hashT = setTimeout(() => { try { history.replaceState(null, "", location.pathname + location.search + "#" + encodeHash()); } catch(e){} }, 300);
}

/* ── shuffle ───────────────────────────────────────────────── */
function shuffle(){
  const pool = GF.fonts.map(r => CATALOG.get(r[0]));
  const textish = f => (f.cat === "Serif" || f.cat === "Sans Serif") && f.ital &&
                       (axisOf(f, "wght") || f.w.length >= 4);
  const bodies  = pool.filter(f => f.pop < 500 && textish(f));
  const bod = bodies[Math.floor(Math.random() * bodies.length)];
  const want = Math.random() < 0.75 ? (bod.cat === "Serif" ? "Sans Serif" : "Serif") : bod.cat;
  const heads = pool.filter(f => f.pop < 800 && f.name !== bod.name &&
                                 (f.cat === want || f.cat === "Display") &&
                                 (axisOf(f, "wght") || f.w.some(w => w >= 600) || f.cat === "Display"));
  const dsp = heads[Math.floor(Math.random() * heads.length)] || bod;
  const p = S.pairs[S.active];
  const dw = axisOf(dsp, "wght") ? 700 : dsp.w.reduce((a, w) => Math.abs(w - 700) < Math.abs(a - 700) ? w : a, dsp.w[0]);
  S.pairs[S.active] = {
    dsp:{ fam:dsp.name, w:dw, ital:false, ls:-0.02, lh:1.08, ax:{} },
    bod:{ fam:bod.name, w:400, ital:false, ls:0, lh:1.62, ax:{} },
    base:p.base, ratio:p.ratio, step:p.step, measure:p.measure, preset:null
  };
  commit(true); track("shuffle");
  toast(`${dsp.name} + ${bod.name}`);
}

/* ── wiring ────────────────────────────────────────────────── */
$$("[data-view]").forEach(b => b.onclick = () => { S.view = b.dataset.view; commit(false); if (S.view !== "editorial") track("view_" + S.view); });
$("#compareBtn").onclick = toggleCompare;
$("#groundLight").onclick = () => { S.ground = "light"; syncChrome(); saveState(); };
$("#groundDark").onclick  = () => { S.ground = "dark";  syncChrome(); saveState(); track("ink"); };
$("#shareBtn").onclick = showShare;
$("#shuffleBtn").onclick = shuffle;
$$(".pairseg button").forEach(b => b.onclick = () => setActive(b.dataset.p));
$("#sheetClose").onclick = closeSheet;

function toggleCompare(){ S.compare = !S.compare; if (!S.compare) S.active = "a"; commit(true); if (S.compare) track("compare_on"); }
/* edit a sheet by clicking it; panes are not re-rendered so a caret in the specimen line survives */
function setActive(k){
  if (!S.compare || S.active === k) return;
  S.active = k; buildControls(); syncChrome(); saveState();
}
["a", "b"].forEach(k => $("#pane-" + k).addEventListener("pointerdown", () => setActive(k)));

/* adjust panel */
function setAdjust(open){
  const a = $("#adjust"), b = $("#adjBtn");
  if (open === !a.hidden) return;
  a.hidden = !open; b.setAttribute("aria-expanded", String(open));
  if (open) track("adjust_open");
}
$("#adjBtn").onclick = () => setAdjust($("#adjust").hidden);
$("#adjClose").onclick = () => { setAdjust(false); $("#adjBtn").focus(); };
$$(".adjtabs button").forEach(b => b.onclick = () => { S.sec = b.dataset.sec; syncChrome(); });
$("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };

document.addEventListener("click", e => {
  if (!e.target.closest(".combo")) $$(".combo.open").forEach(c => { c.classList.remove("open"); c.querySelector(".field-in").setAttribute("aria-expanded", "false"); });
  if (!$("#adjust").hidden && !e.target.closest(".adjust, #adjBtn, .combo, .sheet") && !(S.compare && e.target.closest(".pane"))) setAdjust(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheet").classList.contains("on")){ closeSheet(); return; }
  if (e.key === "Escape" && !$("#adjust").hidden && !e.target.closest(".combo")){ setAdjust(false); $("#adjBtn").focus(); return; }
  const t = e.target;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const k = e.key.toLowerCase();
  if (k === "1"){ S.view = "editorial"; commit(false); }
  else if (k === "2"){ S.view = "mobile"; commit(false); }
  else if (k === "3"){ S.view = "specimen"; commit(false); }
  else if (k === "c"){ toggleCompare(); }
  else if (k === "d"){ S.ground = S.ground === "light" ? "dark" : "light"; syncChrome(); saveState(); }
  else if (k === "s"){ shuffle(); }
  else if (k === "a" || k === "b"){ setActive(k); }
  else return;
  e.preventDefault();
});

/* editable specimen line — keep both panes in step without killing the caret */
document.addEventListener("input", e => {
  const n = e.target;
  if (!n.classList || !n.classList.contains("bigline")) return;
  S.big = n.textContent;
  $$(".bigline").forEach(o => { if (o !== n && o.textContent !== S.big) o.textContent = S.big; });
  clearTimeout(saveT); saveT = setTimeout(saveState, 500);
});

/* synced scrolling in compare mode */
let syncing = false;
["a", "b"].forEach(k => {
  const pane = $("#pane-" + k), other = $("#pane-" + (k === "a" ? "b" : "a"));
  pane.addEventListener("scroll", () => {
    if (!S.compare || syncing) return;
    syncing = true;
    const max = pane.scrollHeight - pane.clientHeight;
    const omax = other.scrollHeight - other.clientHeight;
    other.scrollTop = max > 0 ? (pane.scrollTop / max) * omax : 0;
    other.scrollLeft = pane.scrollLeft;
    requestAnimationFrame(() => { syncing = false; });
  }, { passive:true });
});

/* drag & drop font files */
let dragDepth = 0;
window.addEventListener("dragenter", e => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes("Files")) return;
  dragDepth++; body.dataset.drag = "on";
});
window.addEventListener("dragover", e => { if (body.dataset.drag === "on") e.preventDefault(); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0){ dragDepth = 0; body.dataset.drag = "off"; } });
window.addEventListener("drop", async e => {
  if (body.dataset.drag !== "on") return;
  e.preventDefault(); dragDepth = 0; body.dataset.drag = "off";
  let last = null;
  for (const f of Array.from(e.dataTransfer.files)) last = (await addFontFile(f)) || last;
  if (last){
    const p = S.pairs[S.active];
    p.dsp.fam = last; p.dsp.ax = {}; p.dsp.w = clampWeight(p.dsp); p.preset = null;
    commit(true);
  }
});

/* ── boot ──────────────────────────────────────────────────── */
(async function boot(){
  await loadState();
  const shared = readHash();
  const ref = new URLSearchParams(location.search).get("ref");
  if (ref){
    try { window.clarity && window.clarity("set", "ref", ref); } catch(e){}
    if (ref === "share" && shared) track("share_link_opened");
    try { history.replaceState(null, "", location.pathname + location.hash); } catch(e){}
  }
  syncChrome();
  applyStyles();
  buildControls();
  renderPanes();
})();
